<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GoldenTimeAED — 내 주변 자동심장충격기</title>
  <meta name="theme-color" content="#d92d20">
  <meta name="description" content="가까운 자동심장충격기(AED)를 지도와 목록으로 찾습니다. 오프라인에서도 동작합니다.">
  <!-- 인라인 SVG 파비콘 (별도 파일 요청 없이 404를 막는다) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <!-- iOS는 manifest의 아이콘을 쓰지 않으므로 별도로 지정해야 홈 화면 추가 시 제대로 나온다 -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>GoldenTimeAED</h1>
    <div class="topbar__actions">
      <!-- 설치되지 않은 상태에서만 노출된다. iOS는 자동 설치 API가 없어 안내 시트를 띄운다. -->
      <button id="install-btn" type="button" hidden>설치</button>
      <button id="toggle-btn" type="button" hidden>목록</button>
      <button id="locate-btn" type="button">내 위치</button>
    </div>
  </header>

  <!-- 기기에 저장된 데이터만 훑으므로 오프라인에서도 검색된다 (search.js).
       PC는 GPS가 없어 위치 추정이 부정확하거나 거부되기 쉬운데, 그때 이게 유일한 진입 경로다. -->
  <div class="search">
    <input id="search-input" type="search" placeholder="기관명 또는 주소 검색"
           autocomplete="off" aria-label="기관명 또는 주소 검색">
    <button id="search-clear" type="button" aria-label="검색어 지우기" hidden>×</button>
    <ul id="search-results" class="search__results" role="listbox" hidden></ul>
  </div>

  <!-- 온라인 전용. 네이버 지도는 타일을 매번 서버에서 받으므로 오프라인에서는 비운다. -->
  <div id="map" hidden></div>

  <!-- 오프라인 대체 화면. 온라인에서도 '목록' 버튼으로 볼 수 있다. -->
  <section id="offline" class="offline" hidden>
    <p id="offline-banner" class="offline-banner"></p>

    <div class="offline-map">
      <canvas id="offline-canvas"></canvas>
      <div id="offline-scale" class="scale"></div>
      <button id="compass-btn" class="compass-btn" type="button">나침반 켜기</button>
    </div>

    <div id="offline-list" class="offline-list"></div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <!-- iOS처럼 자동 설치를 지원하지 않는 브라우저에서 뜨는 수동 안내.
       설치를 권하는 이유는 편의가 아니라 저장소 보존이다 (docs/OFFLINE_DESIGN.md). -->
  <div id="install-sheet" class="sheet" hidden>
    <div class="sheet__box" role="dialog" aria-modal="true" aria-labelledby="install-sheet-title">
      <h2 id="install-sheet-title" class="sheet__title">홈 화면에 추가하기</h2>
      <p class="sheet__why">
        평소 안 쓰는 앱이라 브라우저가 저장된 AED 데이터를 지울 수 있습니다.
        홈 화면에 추가하면 오프라인에서도 확실히 동작합니다.
      </p>
      <ol id="install-steps" class="sheet__steps"></ol>
      <button id="install-sheet-close" class="sheet__close" type="button">닫기</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="ui-util.js"></script>
  <script src="geo.js"></script>
  <script src="search.js"></script>
  <script src="data-store.js"></script>
  <script src="sync-data.js"></script>
  <script src="map-view.js"></script>
  <script src="offline-view.js"></script>
  <script src="app.js"></script>
  <script>
    // 네이버 지도 스크립트는 config.js의 클라이언트 ID가 있어야 URL을 만들 수 있고,
    // 오프라인이면 아예 로드되지 않아야 하므로 app.js가 상황을 보고 동적으로 삽입한다.
    App.bootstrap();
  </script>
</body>
</html>
