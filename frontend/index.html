<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>GoldenTimeAED — 내 주변 자동심장충격기</title>
  <!-- 인라인 SVG 파비콘 (별도 파일 요청 없이 404를 막는다) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>GoldenTimeAED</h1>
    <button id="locate-btn" type="button">내 위치</button>
  </header>

  <div id="map"></div>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div id="fatal" class="fatal" hidden>
    <div class="fatal__box">
      <h2>지도를 불러오지 못했습니다</h2>
      <p id="fatal-msg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // 네이버 지도 스크립트는 config.js의 클라이언트 ID가 있어야 URL을 만들 수 있으므로
    // 정적 <script> 태그 대신 여기서 동적으로 삽입한다.
    App.bootstrap();
  </script>
</body>
</html>
