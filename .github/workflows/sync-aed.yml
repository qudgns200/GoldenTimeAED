name: Sync AED data

on:
  schedule:
    # cron은 UTC 기준. 16:17 UTC = 01:17 KST (매일 새벽)
    - cron: "17 16 * * *"
  workflow_dispatch:

# 이전 실행이 아직 돌고 있으면 겹치지 않게 한다 (중복 upsert 방지)
concurrency:
  group: sync-aed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt에는 배치에 필요한 httpx/supabase/python-dotenv만 있다.
      # FastAPI 등 개발용 의존성은 requirements-dev.txt로 분리되어 있으므로 설치하지 않는다.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          SAFETYDATA_API_KEY: ${{ secrets.SAFETYDATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/sync.py

      # Supabase가 갱신됐으니 프론트엔드가 배포하는 정적 스냅샷도 다시 만들어야 한다.
      # Pages는 커밋 푸시 때만 빌드하므로 Deploy Hook으로 직접 재빌드를 건다.
      # 빌드 중 build_snapshot.py가 Supabase에서 전량을 읽어 data/aed-snapshot.json을 만든다
      # (docs/OFFLINE_DESIGN.md).
      #
      # 시크릿이 없으면 조용히 건너뛴다. 스냅샷 배포가 안 되더라도 DB 동기화 자체는
      # 성공한 것이므로 워크플로를 실패로 만들지 않는다.
      - name: Trigger Cloudflare Pages rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK_URL이 없어 재빌드를 건너뜁니다."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" && echo "재빌드 요청 완료"
