name: Sync AED data

on:
  schedule:
    # cron은 UTC 기준. 16:17 UTC = 01:17 KST (매일 새벽)
    - cron: "17 16 * * *"
  workflow_dispatch:

# 스냅샷 갱신 결과를 저장소에 커밋한다.
permissions:
  contents: write

# 이전 실행이 아직 돌고 있으면 겹치지 않게 한다 (push 충돌 방지)
concurrency:
  group: sync-aed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt에는 httpx와 python-dotenv만 있다.
      # FastAPI 등 개발용 의존성은 requirements-dev.txt로 분리되어 있으므로 설치하지 않는다.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 실패하면(API 오류·부분 수집) 파일을 쓰지 않고 종료하므로,
      # 이전 스냅샷이 배포된 채 그대로 남는다.
      - name: Build snapshot
        env:
          SAFETYDATA_API_KEY: ${{ secrets.SAFETYDATA_API_KEY }}
        run: python backend/sync.py

      # sync.py는 행 내용이 실제로 바뀐 날에만 파일을 다시 쓴다.
      # 따라서 변경이 없으면 커밋할 것도 없고 Pages 재빌드도 일어나지 않는다.
      # 커밋을 push하면 Cloudflare Pages가 자동으로 재빌드하므로 Deploy Hook이 필요 없다.
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- frontend/data; then
            echo "스냅샷 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          git commit -m "chore: AED 스냅샷 갱신 ($(date -u +%Y-%m-%d))"
          git push
          echo "스냅샷을 커밋했습니다. Pages가 재빌드됩니다."
