name: Sync AED data

on:
  schedule:
    # cron은 UTC 기준. 16:17 UTC = 01:17 KST (매일 새벽)
    - cron: "17 16 * * *"
  workflow_dispatch:

# 이전 실행이 아직 돌고 있으면 겹치지 않게 한다 (중복 upsert 방지)
concurrency:
  group: sync-aed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt에는 배치에 필요한 httpx/supabase/python-dotenv만 있다.
      # FastAPI 등 개발용 의존성은 requirements-dev.txt로 분리되어 있으므로 설치하지 않는다.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          SAFETYDATA_API_KEY: ${{ secrets.SAFETYDATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/sync.py
